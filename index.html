<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Jewel Atelier Pro</title>
    <style>
        :root { --gold: #d4af37; --bg: #0a0a0a; --diamond: #ffffff; --obsidian: #444; }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { background: var(--bg); color: #e0e0e0; font-family: "Georgia", serif; margin: 0; overflow: hidden; height: 100vh; }
        
        .screen { display: none; flex-direction: column; align-items: center; width: 100%; height: calc(100vh - 85px); padding-top: env(safe-area-inset-top); }
        .active { display: flex; }
        h2 { font-size: 16px; color: var(--gold); letter-spacing: 4px; margin: 20px 0; text-shadow: 0 0 10px rgba(212,175,55,0.5); }

        /* 5x5 盤面 */
        #board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: 85vw; max-width: 340px; background: rgba(255,255,255,0.03); padding: 12px; border-radius: 12px; border: 1px solid rgba(212,175,55,0.2); }
        .cell { aspect-ratio: 1; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 1px solid #222; transition: all 0.5s ease; position: relative; overflow: hidden; }
        
        /* 宝石のエフェクト */
        .cell.P { background: var(--diamond); box-shadow: 0 0 15px #fff, inset 0 0 10px rgba(0,0,0,0.1); border: none; transform: scale(0.9); }
        .cell.P::after { content: '✨'; font-size: 10px; position: absolute; }
        
        .cell.E { background: #1a1a1a; border: 2px solid var(--obsidian); box-shadow: 0 0 10px rgba(255,255,255,0.1); transform: scale(0.85); }

        /* フッター */
        #footer { position: fixed; bottom: 0; width: 100%; height: 85px; background: #111; border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: flex-end; padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
        .nav-item { color: #444; font-size: 9px; text-align: center; flex: 1; padding-bottom: 5px; transition: 0.3s; }
        .nav-item.active { color: var(--gold); }
        .main-icon { width: 50px; height: 50px; background: #000; border: 1px solid var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; margin: 0 auto 4px; box-shadow: 0 0 10px rgba(212,175,55,0.2); }
    </style>
</head>
<body>

    <div id="home-screen" class="screen active">
        <h2>ATELIER</h2>
        <div style="width:180px; height:240px; border:1px solid var(--gold); border-radius:90px 90px 0 0; margin-top:40px; background: linear-gradient(to top, rgba(212,175,55,0.1), transparent); position: relative;">
            <div style="position:absolute; bottom:20px; width:100%; text-align:center; font-size:10px; color:var(--gold); letter-spacing:1px;">SINCE 2026</div>
        </div>
    </div>

    <div id="battle-screen" class="screen">
        <h2>ENGAGEMENT</h2>
        <div id="board"></div>
        <p id="status" style="font-size:11px; margin-top:20px; color:var(--gold); opacity:0.7;">あなたのターンです</p>
    </div>

    <div id="footer">
        <div class="nav-item" onclick="sw('home-screen',this)"><div class="main-icon">🏠</div>HOME</div>
        <div class="nav-item" onclick="sw('battle-screen',this)"><div style="font-size:24px; margin-bottom:10px;">⚔️</div>BATTLE</div>
    </div>

    <script>
        let b = Array(25).fill("");
        function sw(id, el) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active'); el.classList.add('active');
        }
        function init() {
            const container = document.getElementById('board');
            for(let i=0; i<25; i++) {
                let c = document.createElement('div'); c.className = 'cell';
                c.onclick = () => tap(i);
                container.appendChild(c);
            }
        }
        function tap(i) {
            if(b[i] !== "") return;
            b[i] = "P"; flip(i, "P"); render();
            document.getElementById('status').innerText = "相手が思考中...";
            setTimeout(enemy, 600);
        }
        function flip(idx, p) {
            const opp = p === "P" ? "E" : "P";
            const dirs = [-1, 1, -5, 5, -6, 6, -4, 4];
            dirs.forEach(d => {
                let cur = idx + d; let path = [];
                while(cur >= 0 && cur < 25 && b[cur] === opp) {
                    path.push(cur); cur += d;
                    if(Math.abs((cur-d)%5 - cur%5) > 1) break;
                }
                if(cur >= 0 && cur < 25 && b[cur] === p) path.forEach(pi => b[pi] = p);
            });
        }
        function enemy() {
            let e = b.map((v,i)=>v===""?i:null).filter(v=>v!==null);
            if(e.length) { 
                let m = e[Math.floor(Math.random()*e.length)];
                b[m]="E"; flip(m, "E"); render(); 
            }
            document.getElementById('status').innerText = "あなたのターンです";
        }
        function render() {
            const cs = document.getElementsByClassName('cell');
            for(let i=0; i<25; i++) { cs[i].className = 'cell ' + b[i]; }
        }
        init();
    </script>
</body>
</html>
