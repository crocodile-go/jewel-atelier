<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Jewel Atelier - Executive -</title>
    <style>
        :root { --gold: #d4af37; --bg: #050505; --panel: #111; --diamond: #ffffff; --red: #ff3b30; }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { background: var(--bg); color: #e0e0e0; font-family: "Georgia", serif; margin: 0; overflow: hidden; height: 100vh; }
        
        .screen { display: none; flex-direction: column; align-items: center; width: 100%; height: calc(100vh - 85px); padding-top: 40px; text-align: center; }
        .active { display: flex; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        h2 { font-size: 14px; color: var(--gold); letter-spacing: 5px; margin-bottom: 20px; font-weight: normal; }

        /* メールUI */
        .mail-list { width: 90%; display: flex; flex-direction: column; gap: 10px; }
        .mail-card { background: #111; border: 1px solid #222; border-left: 3px solid var(--gold); padding: 15px; text-align: left; border-radius: 4px; position: relative; }
        .mail-title { font-size: 12px; color: var(--gold); margin-bottom: 5px; }
        .mail-body { font-size: 11px; color: #aaa; line-height: 1.4; }
        .gift-tag { position: absolute; right: 10px; bottom: 10px; font-size: 18px; }

        /* ホーム：ログインボーナス（神託） */
        .bonus-container { width: 220px; height: 260px; display: flex; align-items: center; justify-content: center; }
        .oracle-gem { width: 60px; height: 60px; background: var(--diamond); transform: rotate(45deg); box-shadow: 0 0 30px #fff; cursor: pointer; transition: 0.5s; animation: pulse 3s infinite; }
        .oracle-gem.collected { opacity: 0; transform: rotate(45deg) scale(0); }
        
        /* フッター（通知バッジ付） */
        #footer { position: fixed; bottom: 0; width: 100%; height: 85px; background: #0a0a0a; border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { color: #444; font-size: 8px; text-align: center; flex: 1; position: relative; }
        .nav-item.active { color: var(--gold); }
        .badge { position: absolute; top: 0; right: 20%; width: 10px; height: 10px; background: var(--red); border-radius: 50%; display: none; }
        .badge.on { display: block; }
        .nav-icon { font-size: 20px; margin-bottom: 4px; display: block; }

        /* プレースホルダー */
        .coming-soon { color: #333; font-size: 12px; margin-top: 100px; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div id="mail-screen" class="screen">
        <h2>MAIL</h2>
        <div class="mail-list">
            <div class="mail-card" onclick="claimMail(this)">
                <div class="mail-title">運営からのメッセージ</div>
                <div class="mail-body">ディレクター、アトリエの開設おめでとうございます。開発支援として「輝きの欠片」を贈呈します。</div>
                <div class="gift-tag">🎁</div>
            </div>
            <div class="mail-card" onclick="claimMail(this)">
                <div class="mail-title">【重要】システムアップデート</div>
                <div class="mail-body">自律稼働モードを実装しました。これより当アプリは自動で分析・構築を繰り返します。</div>
            </div>
        </div>
    </div>

    <div id="battle-screen" class="screen">
        <h2>ENGAGEMENT</h2>
        <p class="coming-soon">盤面アップデート中...</p>
    </div>

    <div id="home-screen" class="screen active">
        <h2>HOME</h2>
        <div class="bonus-container"><div id="bonus-gem" class="oracle-gem" onclick="collectBonus()"></div></div>
        <div id="oracle-text" style="color:var(--gold); font-size:13px; margin-top:20px;"></div>
    </div>

    <div id="gacha-screen" class="screen"><h2>GACHA</h2><p class="coming-soon">ヒット率分析中...</p></div>
    <div id="atelier-screen" class="screen"><h2>ATELIER</h2><p class="coming-soon">展示フロア準備中...</p></div>

    <div id="footer">
        <div class="nav-item" onclick="sw('mail-screen',this)"><div class="badge on" id="mail-badge"></div><span class="nav-icon">✉️</span>メール</div>
        <div class="nav-item" onclick="sw('battle-screen',this)"><span class="nav-icon">⚔️</span>対戦</div>
        <div class="nav-item active" onclick="sw('home-screen',this)"><span class="nav-icon">🏠</span>ホーム</div>
        <div class="nav-item" onclick="sw('gacha-screen',this)"><span class="nav-icon">💎</span>ガチャ</div>
        <div class="nav-item" onclick="sw('atelier-screen',this)"><span class="nav-icon">⚒️</span>アトリエ</div>
    </div>

    <script>
        // メール受取処理
        function claimMail(el) {
            el.style.opacity = "0.5";
            el.style.borderLeft = "3px solid #333";
            alert("プレゼントを受け取りました");
            document.getElementById('mail-badge').classList.remove('on');
        }

        // ログインボーナス（一度きり）
        function collectBonus() {
            const gem = document.getElementById('bonus-gem');
            gem.classList.add('collected');
            document.getElementById('oracle-text').innerHTML = "本日の神託：【ダイヤモンド】<br>揺るぎない決断が資産を増やします。";
        }

        function sw(id, el) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active'); 
            el.classList.add('active');
        }
    </script>
</body>
</html>
