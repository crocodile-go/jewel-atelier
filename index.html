<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Jewel Atelier</title>
    <style>
        :root { --gold: #d4af37; --bg: #050505; --panel: #111; }
        body { background: var(--bg); color: #e0e0e0; font-family: serif; margin: 0; overflow: hidden; height: 100vh; }
        .screen { display: none; flex-direction: column; align-items: center; width: 100%; height: calc(100vh - 85px); padding-top: 20px; }
        .active { display: flex; }
        #board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; width: 90vw; max-width: 350px; background: #222; padding: 4px; border-radius: 8px; }
        .cell { aspect-ratio: 1; background: #000; display: flex; align-items: center; justify-content: center; font-size: 20px; border-radius: 4px; }
        .cell.P { background: #fff; color: #000; box-shadow: 0 0 10px #fff; }
        .cell.E { border: 2px solid #fff; border-radius: 50%; }
        #footer { position: fixed; bottom: 0; width: 100%; height: 85px; background: var(--panel); border-top: 1px solid #333; display: flex; justify-content: space-around; align-items: flex-end; padding-bottom: 15px; }
        .nav-item { color: #555; font-size: 10px; text-align: center; flex: 1; }
        .nav-item.active { color: var(--gold); }
        .main-icon { width: 50px; height: 50px; background: #000; border: 2px solid var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; margin: 0 auto 5px; }
    </style>
</head>
<body>
    <div id="home-screen" class="screen active"><h2>HOME</h2><div style="width:60%; height:50%; border:1px solid var(--gold); border-radius:100px 100px 0 0; margin-top:50px;"></div></div>
    <div id="battle-screen" class="screen"><h2>BATTLE</h2><div id="board"></div></div>
    <div id="footer">
        <div class="nav-item" onclick="sw('home-screen',this)"><div class="main-icon">🏠</div>ホーム</div>
        <div class="nav-item" onclick="sw('battle-screen',this)"><div style="font-size:24px">⚔️</div>対戦</div>
    </div>
    <script>
        let b = Array(25).fill("");
        function sw(id, el) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active'); el.classList.add('active');
        }
        function init() {
            const container = document.getElementById('board');
            for(let i=0; i<25; i++) {
                let c = document.createElement('div'); c.className = 'cell';
                c.onclick = () => { if(b[i]=="") { b[i]="P"; render(); setTimeout(enemy, 500); } };
                container.appendChild(c);
            }
        }
        function enemy() {
            let e = b.map((v,i)=>v==""?i:null).filter(v=>v!==null);
            if(e.length) { b[e[Math.floor(Math.random()*e.length)]]="E"; render(); }
        }
        function render() {
            const cs = document.getElementsByClassName('cell');
            for(let i=0; i<25; i++) { cs[i].innerText = b[i]; cs[i].className = 'cell ' + b[i]; }
        }
        init();
    </script>
</body>
</html>
