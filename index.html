<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Jewel Atelier - Card Engagement -</title>
    <style>
        :root { --gold: #d4af37; --bg: #050505; --card-p: #ffffff; --card-e: #1a1a1a; }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { background: var(--bg); color: #e0e0e0; font-family: "serif"; margin: 0; overflow: hidden; height: 100vh; }
        
        .screen { display: none; flex-direction: column; align-items: center; width: 100%; height: calc(100vh - 85px); padding-top: 20px; }
        .active { display: flex; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* カード盤面 */
        #board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; width: 95vw; max-width: 380px; padding: 10px; background: #111; border-radius: 4px; border: 1px solid var(--gold); }
        .cell { aspect-ratio: 0.7; background: rgba(255,255,255,0.05); border: 1px solid #333; border-radius: 4px; display: flex; align-items: center; justify-content: center; transition: 0.3s; position: relative; }
        
        /* プレイヤーカード（今後イラスト挿入予定） */
        .cell.P { background: #fff; border: 2px solid var(--gold); color: #000; font-size: 10px; font-weight: bold; }
        .cell.P::before { content: "JEWEL"; position: absolute; top: 2px; font-size: 8px; }

        /* 敵カード */
        .cell.E { background: #222; border: 2px solid #444; color: #fff; font-size: 10px; }

        /* 手札エリア（将来の拡張） */
        #hand { width: 100%; height: 60px; display: flex; justify-content: center; gap: 10px; margin-top: 20px; }
        .hand-card { width: 40px; height: 55px; background: var(--gold); border-radius: 4px; opacity: 0.8; }

        #status-text { color: var(--gold); font-size: 12px; margin-top: 15px; letter-spacing: 2px; }

        /* 共通ボタン・ナビ */
        .btn { background: #111; border: 1px solid var(--gold); color: var(--gold); padding: 10px 20px; border-radius: 4px; margin-top: 10px; }
        #footer { position: fixed; bottom: 0; width: 100%; height: 85px; background: #000; border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { color: #444; font-size: 8px; text-align: center; flex: 1; }
        .nav-item.active { color: var(--gold); }
    </style>
</head>
<body>

    <div id="battle-screen" class="screen active">
        <h2 style="font-size:12px; color:var(--gold);">5-IN-A-ROW BATTLE</h2>
        <div id="board"></div>
        <div id="status-text">Your Turn - 5つ並べろ</div>
        <div id="hand">
            <div class="hand-card"></div><div class="hand-card"></div><div class="hand-card"></div>
        </div>
        <button class="btn" onclick="resetGame()">RESET</button>
    </div>

    <div id="footer">
        <div class="nav-item"><span>✉️</span><br>メール</div>
        <div class="nav-item active"><span>⚔️</span><br>対戦</div>
        <div class="nav-item"><span>🏠</span><br>ホーム</div>
        <div class="nav-item"><span>💎</span><br>ガチャ</div>
        <div class="nav-item"><span>⚒️</span><br>アトリエ</div>
    </div>

    <script>
        let boardData = Array(25).fill("");

        function init() {
            const container = document.getElementById('board');
            container.innerHTML = "";
            for(let i=0; i<25; i++) {
                let c = document.createElement('div');
                c.className = 'cell';
                c.onclick = () => playerMove(i);
                container.appendChild(c);
            }
        }

        function playerMove(i) {
            if(boardData[i] !== "") return;
            boardData[i] = "P";
            render();
            if(checkWin("P")) return;
            
            document.getElementById('status-text').innerText = "CPU Thinking...";
            setTimeout(cpuMove, 600);
        }

        function cpuMove() {
            let empties = boardData.map((v, i) => v === "" ? i : null).filter(v => v !== null);
            if(empties.length) {
                let move = empties[Math.floor(Math.random() * empties.length)];
                boardData[move] = "E";
                render();
                if(checkWin("E")) return;
            }
            document.getElementById('status-text').innerText = "Your Turn";
        }

        function render() {
            const cs = document.getElementsByClassName('cell');
            for(let i=0; i<25; i++) {
                cs[i].className = 'cell ' + boardData[i];
                cs[i].innerText = boardData[i];
            }
        }

        function checkWin(p) {
            const lines = [];
            // 横
            for(let i=0; i<5; i++) lines.push([i*5, i*5+1, i*5+2, i*5+3, i*5+4]);
            // 縦
            for(let i=0; i<5; i++) lines.push([i, i+5, i+10, i+15, i+20]);
            // 斜め
            lines.push([0, 6, 12, 18, 24]);
            lines.push([4, 8, 12, 16, 20]);

            for(let line of lines) {
                if(line.every(idx => boardData[idx] === p)) {
                    alert(p === "P" ? "VICTORY!" : "DEFEAT...");
                    resetGame();
                    return true;
                }
            }
            if(!boardData.includes("")) { alert("DRAW"); resetGame(); return true; }
            return false;
        }

        function resetGame() {
            boardData.fill("");
            render();
            document.getElementById('status-text').innerText = "Your Turn";
        }

        init();
    </script>
</body>
</html>
