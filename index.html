<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Jewel Atelier - Executive -</title>
    <style>
        :root { --gold: #d4af37; --bg: #050505; --panel: #111; --diamond: #ffffff; }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { background: var(--bg); color: #e0e0e0; font-family: "Georgia", serif; margin: 0; overflow: hidden; height: 100vh; }
        
        .screen { display: none; flex-direction: column; align-items: center; width: 100%; height: calc(100vh - 85px); padding-top: 40px; text-align: center; }
        .active { display: flex; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        h2 { font-size: 14px; color: var(--gold); letter-spacing: 5px; margin-bottom: 20px; font-weight: normal; }

        /* ホーム：ログインボーナスUI */
        .bonus-container { width: 220px; height: 280px; display: flex; align-items: center; justify-content: center; position: relative; }
        .oracle-gem { width: 60px; height: 60px; background: var(--diamond); transform: rotate(45deg); box-shadow: 0 0 30px #fff; cursor: pointer; transition: 0.5s; animation: pulse 3s infinite; }
        .oracle-gem.collected { opacity: 0; pointer-events: none; transform: rotate(45deg) scale(0); }
        @keyframes pulse { 0% { transform: rotate(45deg) scale(1); } 50% { transform: rotate(45deg) scale(1.1); box-shadow: 0 0 50px #fff; } 100% { transform: rotate(45deg) scale(1); } }
        
        #oracle-text { font-size: 13px; line-height: 1.8; color: var(--gold); padding: 0 30px; margin-top: 20px; min-height: 80px; }

        /* 対戦盤面 */
        #board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; width: 85vw; max-width: 330px; background: rgba(255,255,255,0.03); padding: 10px; border-radius: 8px; border: 1px solid rgba(212,175,55,0.2); }
        .cell { aspect-ratio: 1; background: rgba(0,0,0,0.6); border-radius: 50%; border: 1px solid #222; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .cell.P { background: var(--diamond); box-shadow: 0 0 15px #fff; border: none; }
        .cell.E { background: #1a1a1a; border: 2px solid #444; }

        /* 5タブ・フッターナビゲーション */
        #footer { position: fixed; bottom: 0; width: 100%; height: 85px; background: #0a0a0a; border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { color: #444; font-size: 8px; text-align: center; flex: 1; transition: 0.3s; }
        .nav-item.active { color: var(--gold); }
        .nav-icon { font-size: 20px; margin-bottom: 4px; display: block; }
        .nav-item.active .nav-icon { transform: scale(1.1); text-shadow: 0 0 10px var(--gold); }
        
        .placeholder-text { color: #444; font-size: 12px; margin-top: 100px; font-style: italic; }
    </style>
</head>
<body>

    <!-- 各画面の定義 -->
    <div id="mail-screen" class="screen">
        <h2>MAIL</h2>
        <p class="placeholder-text">未読のメッセージはありません</p>
    </div>

    <div id="battle-screen" class="screen">
        <h2>ENGAGEMENT</h2>
        <div id="board"></div>
        <p style="font-size:11px; margin-top:20px; color:var(--gold); opacity:0.6;">Your Turn</p>
    </div>

    <div id="home-screen" class="screen active">
        <h2>HOME</h2>
        <div class="bonus-container">
            <div id="bonus-gem" class="oracle-gem" onclick="collectBonus()"></div>
        </div>
        <div id="oracle-text">
            宝石をタップして<br>本日のログインボーナスを<br>受け取ってください
        </div>
    </div>

    <div id="gacha-screen" class="screen">
        <h2>GACHA</h2>
        <p class="placeholder-text">準備中...</p>
    </div>

    <div id="atelier-screen" class="screen">
        <h2>ATELIER</h2>
        <p class="placeholder-text">あなたのコレクション</p>
    </div>

    <!-- 5タブ・ナビゲーション -->
    <div id="footer">
        <div class="nav-item" onclick="sw('mail-screen',this)"><span class="nav-icon">✉️</span>メール</div>
        <div class="nav-item" onclick="sw('battle-screen',this)"><span class="nav-icon">⚔️</span>対戦</div>
        <div class="nav-item active" onclick="sw('home-screen',this)"><span class="nav-icon">🏠</span>ホーム</div>
        <div class="nav-item" onclick="sw('gacha-screen',this)"><span class="nav-icon">💎</span>ガチャ</div>
        <div class="nav-item" onclick="sw('atelier-screen',this)"><span class="nav-icon">⚒️</span>アトリエ</div>
    </div>

    <script>
        // ログインボーナスのロジック
        function collectBonus() {
            const gem = document.getElementById('bonus-gem');
            const text = document.getElementById('oracle-text');
            
            const rewards = [
                "【ダイヤモンドの加護】<br>今日の商談に不屈の輝きを。",
                "【ルビーの情熱】<br>投資の決断に勝機あり。",
                "【サファイアの知性】<br>冷静な判断が資産を守ります。",
                "【エメラルドの癒やし】<br>休息が次の大きな利益を生むでしょう。"
            ];

            gem.classList.add('collected');
            text.innerHTML = rewards[Math.floor(Math.random() * rewards.length)] + "<br><br><span style='color:#555;'>本日のボーナス受取済</span>";
            
            // ローカルストレージに日付を保存すれば翌日まで消せますが、まずは「押したら消える」挙動を優先。
        }

        // 画面切り替えロジック
        function sw(id, el) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active'); 
            el.classList.add('active');
        }

        // 対戦ロジック（簡易版を維持）
        let b = Array(25).fill("");
        function init() {
            const container = document.getElementById('board');
            for(let i=0; i<25; i++) {
                let c = document.createElement('div'); c.className = 'cell';
                c.onclick = () => { if(b[i]=="") { b[i]="P"; render(); setTimeout(enemy, 500); } };
                container.appendChild(c);
            }
        }
        function enemy() {
            let e = b.map((v,i)=>v===""?i:null).filter(v=>v!==null);
            if(e.length) { b[e[Math.floor(Math.random()*e.length)]]="E"; render(); }
        }
        function render() {
            const cs = document.getElementsByClassName('cell');
            for(let i=0; i<25; i++) { cs[i].className = 'cell ' + b[i]; }
        }
        init();
    </script>
</body>
</html>
